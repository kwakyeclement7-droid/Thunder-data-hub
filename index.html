<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thunder Cheap Data Hub</title>
<style>
body{font-family:Arial;margin:0;background:#fff}
.header{background:#ffcc00;padding:20px;text-align:center}
.card{border:2px solid #ffcc00;margin:10px;padding:15px;border-radius:12px;display:flex;justify-content:space-between;align-items:center}
.btn{background:#ffcc00;border:none;padding:10px 18px;border-radius:8px;font-weight:bold}
input{width:100%;padding:12px;margin:8px 0;border-radius:8px;border:1px solid #ccc;box-sizing:border-box}
.box{padding:15px;background:#f5f5f5}
</style>
</head>
<body>
<div class="header">
<h2>⚡️ Thunder Cheap Data Hub</h2>
<p>MTN • Telecel • AirtelTigo • Instant</p>
</div>
<div id="list"></div>
<div class="box">
<h3>Place Order</h3>
<input id="num" placeholder="MTN Number e.g. 024...">
<input id="bundle" placeholder="Bundle" readonly>
<button class="btn" style="width:100%;background:#25D366;color:white;padding:15px" onclick="order()">Order on WhatsApp 🟢</button>
</div>
<script>
const data=[{gb:"1GB",p:5},{gb:"2GB",p:10},{gb:"3GB",p:14.5},{gb:"4GB",p:20},{gb:"5GB",p:24.5},{gb:"6GB",p:27},{gb:"8GB",p:35},{gb:"10GB",p:45},{gb:"15GB",p:65},{gb:"20GB",p:90},{gb:"25GB",p:110},{gb:"30GB",p:130},{gb:"50GB",p:210}];
let h=""; data.forEach(d=>{h+=`<div class=card><div><b>${d.gb}</b><br>Gh¢${d.p}</div><button class=btn onclick="document.getElementById('bundle').value='${d.gb} - Gh¢${d.p}'">Buy</button></div>`});
document.getElementById("list").innerHTML=h;
function order(){let n=document.getElementById("num").value;let b=document.getElementById("bundle").value;if(!n||!b){alert("Select bundle and number");return}window.open(`https://wa.me/233257439080?text=Hello Thunder Hub ⚡️ I want ${b} for ${n}`)}
</script>
</body>
</html>
