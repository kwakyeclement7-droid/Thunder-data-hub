<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Thunder Cheap Data Hub</title>
<script src="https://js.paystack.co/v1/inline.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#0f172a;color:#fff;min-height:100vh}
.top{background:linear-gradient(90deg,#FFD700,#FFC300);color:#000;padding:14px;text-align:center;font-weight:900;font-size:18px;letter-spacing:0.5px}
.wrap{padding:14px;max-width:480px;margin:0 auto}
.box{background:#1e293b;border-radius:16px;padding:18px;margin-bottom:16px}
.box h3{text-align:center;margin-bottom:14px;font-size:18px}
.box input,.box select{width:100%;padding:14px;border-radius:10px;border:none;margin-bottom:10px;font-size:15px;outline:none}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:#1e293b;border-radius:14px;padding:16px;text-align:center;border:1px solid #2a3955}
.card.gb{color:#FFD700;font-weight:900;font-size:20px}
.card.sub{font-size:13px;color:#cbd5e1;margin:6px 0}
.card.price{font-weight:900;font-size:18px;margin:6px 0}
.card button{width:100%;background:#FFD700;color:#000;border:none;padding:10px;border-radius:8px;font-weight:900;margin-top:8px}
#toast{position:fixed;top:15px;left:12px;right:12px;padding:14px;border-radius:10px;text-align:center;font-weight:900;display:none;z-index:9999}
#toast.show{display:block}
.ok{background:#00c853;color:#fff}.err{background:#ff1744;color:#fff}.load{background:#FFD700;color:#000}
.tabs{display:flex;gap:8px;margin-bottom:14px}
.t{flex:1;padding:10px;text-align:center;background:#1e293b;border-radius:10px;font-weight:900;border:2px solid #FFD700;color:#FFD700}
.t.active{background:#FFD700;color:#000}
</style>
</head>
<body>
<div class="top">⚡ THUNDER CHEAP DATA HUB ⚡</div>
<div class="wrap">
<div id="toast"></div>
<div class="box">
<h3>Enter Beneficiary Details</h3>
<input id="phone" type="tel" placeholder="Beneficiary Number (e.g. 054...)" maxlength="10">
<select id="net" onchange="render()"><option value="mtn">MTN</option><option value="telecel">Telecel</option><option value="airteltigo">AirtelTigo</option></select>
<input id="email" type="email" placeholder="Your Email (for receipt)">
</div>
<div class="tabs"><div class="t active" id="tm" onclick="setNet('mtn')">MTN</div><div class="t" id="tt" onclick="setNet('telecel')">Telecel</div><div class="t" id="ta" onclick="setNet('airteltigo')">AT</div></div>
<div id="grid" class="grid"></div>
<div style="text-align:center;margin-top:20px;padding:12px;background:#FFD700;color:#000;border-radius:10px;font-weight:900">WhatsApp: 0257439080 | 0201898576<br><a href="admin.html" style="color:#000">Admin</a></div>
</div>
<script>
const data={mtn:[{g:'1GB',d:'90 Days',p:4.2},{g:'2GB',d:'90 Days',p:8.4},{g:'3GB',d:'90 Days',p:13},{g:'5GB',d:'90 Days',p:20},{g:'10GB',d:'90 Days',p:40.5},{g:'15GB',d:'90 Days',p:55},{g:'20GB',d:'90 Days',p:75},{g:'25GB',d:'90 Days',p:90}],telecel:[{g:'10GB',d:'90 Days',p:39},{g:'15GB',d:'90 Days',p:80},{g:'20GB',d:'90 Days',p:70},{g:'30GB',d:'90 Days',p:110},{g:'50GB',d:'30 Days',p:190}],airteltigo:[{g:'1GB',d:'90 Days',p:4.5},{g:'2GB',d:'30 Days',p:9},{g:'5GB',d:'30 Days',p:22},{g:'10GB',d:'30 Days',p:42},{g:'20GB',d:'30 Days',p:78}]};
let cur='mtn';const KEY='pk_live_45851513b7f163a6bba4081f633c923ebc48cf32';
function setNet(n){cur=n;document.getElementById('net').value=n;document.querySelectorAll('.t').forEach(x=>x.classList.remove('active'));document.getElementById('t'+n[0]).classList.add('active');render();}
function render(){let h='';data[cur].forEach(x=>{h+=`<div class="card"><div class="gb">${x.g}</div><div class="sub">${cur.toUpperCase()} - ${x.d}</div><div class="price">Ghc ${x.p}</div><button onclick="buy('${x.g}',${x.p})">BUY</button></div>`;});document.getElementById('grid').innerHTML=h;}
function toast(m,c){let t=document.getElementById('toast');t.textContent=m;t.className='show '+c;setTimeout(()=>t.className='',4000);}
function buy(gb,price){
let phone=document.getElementById('phone').value.trim();let email=document.getElementById('email').value.trim();
if(phone.length<10){toast('Enter valid number!','err');return;}
if(!email.includes('@')){toast('Enter email!','err');return;}
PaystackPop.setup({key:KEY,email:email,amount:Math.round(price*100),currency:'GHS',ref:'THUNDER_'+Date.now(),
callback:function(r){
let orders=JSON.parse(localStorage.getItem('thunder_orders')||'[]');
orders.push({phone,email,network:cur,package:gb,amount:price,ref:r.reference,time:new Date().toISOString(),delivered:false});
localStorage.setItem('thunder_orders',JSON.stringify(orders));
toast('✅ PAID '+gb+' to '+phone+'! Order saved!','ok');
},onClose:function(){toast('Cancelled','err');}
}).openIframe();
}
render();
</script>
</body>
</html>
