<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Delivery Tracker - Thunder</title>
<style>
body{background:#0f172a;color:#fff;font-family:Arial;padding:15px}
.card{background:#1e293b;padding:15px;border-radius:12px;margin:10px 0;border-left:4px solid #f59e0b}
.delivered{border-left-color:#22c55e;opacity:0.6}
button{padding:8px 15px;border:none;border-radius:8px;font-weight:bold;margin-top:8px}
.btn-deliver{background:#22c55e;color:#fff}
.btn-pending{background:#f59e0b;color:#000}
</style>
</head>
<body>
<h2 style="color:#f59e0b">📦 Delivery Tracker - LIVE</h2>
<p>Auto-tracking! New 1GB (GHS 5) orders appear here!</p>

<div id="list"></div>

<script>
function getOrders(){
// Get old manual + new auto orders
let manual=[
{ref:'TH_1788716742066',bundle:'1GB MTN',price:'GHS 5.00',phone:'X080',date:'6th Sep',delivered:true},
{ref:'TH_1788718041504',bundle:'1GB MTN',price:'GHS 5.00',phone:'X080',date:'6th Sep',delivered:true}
];
let auto=JSON.parse(localStorage.getItem('thunder_orders')||'[]');
// Merge, avoid duplicates
let all=[...manual];
auto.forEach(a=>{
 if(!all.find(x=>x.ref===a.ref)) all.unshift(a);
});
return all;
}

let orders=getOrders();

function render(){
if(orders.length===0){
 document.getElementById('list').innerHTML='<p>No orders yet. Share your shop link!</p>';
 return;
}
let html='';
orders.forEach((o,i)=>{
html+=`<div class="card ${o.delivered?'delivered':''}">
<b>${o.bundle} - ${o.price}</b><br>
Ref: ${o.ref}<br>
Phone: ${o.phone} | Date: ${o.date}<br>
Email: ${o.email||'gmail'}<br>
Status: ${o.delivered?'✅ DELIVERED':'⏳ PENDING - SEND DATA NOW!'}<br>
<button class="${o.delivered?'btn-pending':'btn-deliver'}" onclick="toggle(${i})">${o.delivered?'Mark Pending':'Mark as DELIVERED ✅'}</button>
<a href="https://wa.me/${o.phoneFull||''}?text=Your ${o.bundle} is delivered! Ref ${o.ref}" style="margin-left:8px;text-decoration:none"><button style="background:#25D366;color:#fff">WhatsApp</button></a>
</div>`;
});
document.getElementById('list').innerHTML=html;
localStorage.setItem('thunder_all_orders',JSON.stringify(orders));
}

function toggle(i){
orders[i].delivered=!orders[i].delivered;
render();
}

render();
setInterval(()=>{ orders=getOrders(); render(); },3000);
</script>

<p style="margin-top:30px;text-align:center">
<a href="index.html" style="color:#f59e0b">← Back to Shop</a><br><br>
<b>How it works when NEW order comes:</b><br>
1. Customer pays GHS 5<br>
2. Order appears here AUTOMATICALLY as PENDING<br>
3. You send data<br>
4. Click DELIVERED → Turns GREEN!
</p>
</body>
</html>
