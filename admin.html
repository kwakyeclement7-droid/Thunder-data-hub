<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Thunder Admin</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#0a0a0a;color:#fff;padding:12px}
.header{background:#FFD700;color:#000;padding:14px;border-radius:12px;text-align:center;font-weight:900}
.card{background:#1a1a1a;border:1px solid #333;border-radius:12px;padding:12px;margin:10px 0}
.phone{font-size:18px;font-weight:900;color:#FFD700}
.gb{font-weight:900;background:#FFD700;color:#000;padding:4px 8px;border-radius:6px}
.btn{width:48%;padding:10px;border-radius:8px;border:none;font-weight:900;margin-top:10px}
.btn-del{background:#00c853;color:#fff}
.btn-wa{background:#25D366;color:#fff}
.stat{display:flex;gap:8px;margin:12px 0}
.stat div{flex:1;background:#1a1a1a;border:1px solid #333;padding:12px;border-radius:10px;text-align:center}
.stat b{color:#FFD700;font-size:20px}
#login{background:#111;position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:999}
#login div{background:#1a1a1a;padding:20px;border-radius:12px;width:90%;max-width:320px;border:2px solid #FFD700}
#login input{width:100%;padding:12px;margin-top:10px;border-radius:8px;border:1px solid #444;background:#000;color:#fff}
</style>
</head>
<body>
<div id="login"><div>
<h3 style="color:#FFD700;text-align:center">⚡ Thunder Admin</h3>
<input id="pin" type="password" placeholder="PIN: 0808">
<button onclick="if(document.getElementById('pin').value=='0808'){document.getElementById('login').style.display='none';loadOrders()}else{alert('Wrong PIN')}" style="width:100%;margin-top:12px;padding:12px;background:#FFD700;color:#000;border:none;border-radius:8px;font-weight:900">UNLOCK</button>
</div></div>
<div class="header">⚡ THUNDER ORDERS ⚡</div>
<div class="stat"><div><b id="total">0</b><br>Total</div><div><b id="today">Ghc 0</b><br>Sales</div><div><b id="pend">0</b><br>Pending</div></div>
<div style="display:flex;gap:8px"><button onclick="if(confirm('Clear?')){localStorage.removeItem('thunder_orders');loadOrders()}" style="flex:1;padding:8px;background:#ff1744;color:#fff;border:none;border-radius:8px">Clear</button><button onclick="loadOrders()" style="flex:1;padding:8px;background:#333;color:#fff;border:none;border-radius:8px">Refresh</button></div>
<div id="orders"></div>
<script>
function loadOrders(){
let orders=JSON.parse(localStorage.getItem('thunder_orders')||'[]');
document.getElementById('total').textContent=orders.length;
let sum=0,pend=0;orders.forEach(o=>{if(!o.delivered)pend++;if(new Date(o.time).toDateString()==new Date().toDateString())sum+=Number(o.amount);});
document.getElementById('today').textContent='Ghc '+sum;
document.getElementById('pend').textContent=pend;
let html='';if(orders.length==0){html='<div style="text-align:center;padding:30px;color:#666">No orders yet</div>';}
else{orders.slice().reverse().forEach((o,i)=>{html+=`<div class="card" style="${o.delivered?'opacity:0.5':''}"><div style="display:flex;justify-content:space-between"><span class="phone">${o.phone}</span><span class="gb">${o.package} Ghc${o.amount}</span></div><div style="font-size:12px;color:#aaa;margin-top:6px">${o.network.toUpperCase()} | ${o.ref}<br>${new Date(o.time).toLocaleString()}<br>${o.email}</div><div style="display:flex;gap:8px"><button class="btn btn-wa" onclick="window.open('https://wa.me/${o.phone.replace('0','233')}?text=Your ${o.package} is coming!')">WhatsApp</button><button class="btn btn-del" onclick="let a=JSON.parse(localStorage.getItem('thunder_orders')||'[]');let idx=a.length-1-${i};a[idx].delivered=true;localStorage.setItem('thunder_orders',JSON.stringify(a));loadOrders()">${o.delivered?'✅ Done':'Mark Done'}</button></div></div>`;});}
document.getElementById('orders').innerHTML=html;
}
setInterval(()=>{if(document.getElementById('login').style.display=='none')loadOrders();},5000);
</script>
</body>
</html>
